[package]
name = "quiver-core"
version = "0.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
# Embedded durable state (DESIGN §11). `bundled` compiles SQLite from source so
# there is no system libsqlite3 dependency on any target.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
