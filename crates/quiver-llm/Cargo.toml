[package]
name = "quiver-llm"
version = "0.0.0"
edition = "2021"
description = "Quiver — 共享 LLM 适配层(千问凭证 + chat/embedding HTTP),key 运行时从 ~/.agents/resources.json 读"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 千问(DashScope OpenAI 兼容)HTTP。rustls,无系统 OpenSSL 依赖。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
