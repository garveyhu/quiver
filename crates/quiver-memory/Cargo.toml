[package]
name = "quiver-memory"
version = "0.0.0"
edition = "2021"
description = "Quiver — durable SQLite agent memory (episodes + bi-temporal facts, DESIGN §6/§20)"

[dependencies]
anyhow = "1"
# Embedded durable state. `bundled` compiles SQLite from source so there is no
# system libsqlite3 dependency on any target (matches quiver-store).
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
