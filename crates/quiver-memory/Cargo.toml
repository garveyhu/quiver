[package]
name = "quiver-memory"
version = "0.0.0"
edition = "2021"
description = "Quiver — durable SQLite agent memory (episodes + bi-temporal facts, DESIGN §6/§20)"

[dependencies]
anyhow = "1"
# Serialize record/brief shapes for the Tauri IPC wire (camelCase to the UI).
serde = { version = "1", features = ["derive"] }
# Parse ~/.agents/resources.json for 千问 creds (always; parse logic is unit-tested).
serde_json = "1"
# Embedded durable state. `bundled` compiles SQLite from source so there is no
# system libsqlite3 dependency on any target (matches quiver-store).
rusqlite = { version = "0.31", features = ["bundled"] }
# 真千问 HTTP(embedding/chat)走共享适配层 quiver-llm,只在 `qwen` feature 下启用 ——
# 默认构建离线、不拉 HTTP(测试用 FakeEmbedder / FakeJudge)。
quiver-llm = { path = "../quiver-llm", optional = true }

[features]
# 启用真网络的 QwenEmbedder/QwenJudge(经 quiver-llm 调千问)。默认关。
qwen = ["dep:quiver-llm"]

[dev-dependencies]
tempfile = "3"
