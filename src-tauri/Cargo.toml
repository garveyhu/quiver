[package]
name = "quiver-app"
version = "0.0.0"
edition = "2021"
description = "Quiver — gamified overnight supervisor for headless coding agents"
# Name the dev binary "Quiver" so `cargo tauri dev` shows "Quiver" in the macOS
# Dock (the binary name is the Dock label in dev). The built .app uses
# productName from tauri.conf.json.
default-run = "Quiver"

# The Tauri app's library + binary. `main.rs` is a thin shim that calls into the
# lib so the same code is testable and reusable (Tauri 2 convention).
[lib]
name = "quiver_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# The vendored dev-bridge (`dev_bridge.rs`) carries illustrative doc examples
# that are not standalone-compilable; this app crate ships no public library
# API meant to be doctested, so skip doctests instead of editing vendored code.
doctest = false

[[bin]]
name = "Quiver"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
# §12: repair the sparse launchd PATH so child processes (git, the agent binary)
# are findable when launched from a packaged .app via Finder. Distributed only as
# a git dependency by the Tauri team — it is not published to crates.io.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "dev" }

# The pure-Rust supervisor — path dependency on the workspace crate.
quiver-core = { path = "../crates/quiver-core" }
# Durable SQLite persistence (picked project, recents, run history).
quiver-store = { path = "../crates/quiver-store" }
# Durable agent memory (episodes + bi-temporal facts, DESIGN §6/§20).
quiver-memory = { path = "../crates/quiver-memory" }
# AI 经理编排(决策模型/流控/价值闸,DESIGN §5/§21)。
quiver-orchestrator = { path = "../crates/quiver-orchestrator" }
tauri-plugin-dialog = "2.7.1"
# The async runtime the queue scheduler uses to run up to `maxWorkers` tasks
# concurrently (one `tokio::spawn` per worker) with a `Semaphore` concurrency
# cap. Tauri already pulls tokio in transitively; declared explicitly here so
# the scheduler's use of `spawn` / `sync::Semaphore` is a first-class dep.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# tauri-agent-tools dev bridge (debug-only; the `dev_bridge` module is gated
# behind `#[cfg(debug_assertions)]` so the bridge — and its localhost HTTP
# server — never ships in a release build). Lets external agent tooling eval JS,
# read the DOM, and capture element screenshots against the live webview.
tiny_http = "0.12"
scopeguard = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
