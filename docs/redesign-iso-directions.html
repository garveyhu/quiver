<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiver · 自治 AI 公司</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0a0e1a; color: var(--tx-1); font-family: var(--ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; letter-spacing: .1px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "ss01" 1; letter-spacing: 0; }
  :root {
    --tw: 64px; --th: 32px;
    --mono: "SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
    --ui: -apple-system,"SF Pro Text","Inter","PingFang SC","Microsoft YaHei",sans-serif;
    --s-0: rgba(11,15,26,.72); --s-1: rgba(18,24,42,.82); --s-2: rgba(22,29,50,.94);
    --s-inset: rgba(8,11,20,.55); --tint-hi: rgba(255,255,255,.05);
    --bd: rgba(255,255,255,.09); --bd-soft: rgba(255,255,255,.06); --bd-strong: rgba(255,255,255,.14);
    --hairline-top: rgba(255,255,255,.10);
    --tx-1: #eef2fb; --tx-2: #aab4cd; --tx-3: #76819c;
    --accent: #ffd27a; --accent-dim: rgba(255,210,122,.14);
    --ok: #7bc47e; --ok-soft: rgba(123,196,126,.13);
    --warn: #f0b24a; --warn-soft: rgba(240,178,74,.14);
    --bad: #e2604f; --bad-soft: rgba(226,96,79,.13); --info: #8fd0ff;
    --r-1: 8px; --r-2: 11px; --r-3: 14px; --r-pill: 999px;
    --sh-1: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.28);
    --sh-2: 0 2px 8px rgba(0,0,0,.34), 0 16px 48px rgba(0,0,0,.42);
    --sh-3: 0 8px 24px rgba(0,0,0,.46), 0 32px 96px rgba(0,0,0,.52);
    --blur: blur(13px) saturate(1.25); --blur-sm: blur(8px) saturate(1.2);
    --ease: cubic-bezier(.32,.72,.24,1); --t-fast: .12s; --t-mid: .2s;
  }

  #stage { position: fixed; inset: 0; background: radial-gradient(130% 100% at 50% 32%, #1b2440 0%, #10162b 62%, #0a0e1a 100%); }
  .scene-fit { position: absolute; inset: 0; display: grid; place-items: center; }
  .world { position: relative; transform: scale(var(--s,1)); transform-origin: center; }

  .tile { position: absolute; width: var(--tw); height: var(--th); margin-left: calc(var(--tw)/-2); margin-top: calc(var(--th)/-2);
    clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
  .buildmark { position: absolute; width: var(--tw); height: var(--th); margin-left: calc(var(--tw)/-2); margin-top: calc(var(--th)/-2);
    clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); background: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,210,122,.10) 5px 7px); display: grid; place-items: center; }
  .buildmark b { color: #7c89ad; font-size: 13px; font-weight: 400; }
  .roomlabel { position: absolute; transform: translate(-50%,-50%); font-size: 10.5px; letter-spacing: 1.2px; color: var(--tx-2); background: rgba(10,14,26,.5);
    padding: 3px 9px; border-radius: var(--r-1); white-space: nowrap; pointer-events: none; backdrop-filter: blur(2px); border: 1px solid var(--bd-soft); }

  .poly { position: absolute; inset: 0; pointer-events: none; transition: background .3s; }
  .rect { position: absolute; pointer-events: none; transition: background .3s; }
  .glow { position: absolute; border-radius: 50%; filter: blur(9px); mix-blend-mode: screen; pointer-events: none; }
  .lightpool { position: absolute; width: 78px; height: 40px; margin-left: -39px; margin-top: -16px; border-radius: 50%; filter: blur(9px); opacity: 0; mix-blend-mode: screen; transition: opacity .45s, background .3s; pointer-events: none; will-change: opacity, transform; }
  .lightpool::before { content:""; position:absolute; left:50%; top:50%; width:46%; height:46%; transform:translate(-50%,-50%); border-radius:50%; background:inherit; filter:brightness(1.5) blur(3px); }
  .lightpool.on { opacity: .9; animation: lp-pulse 2.6s ease-in-out infinite; }
  @keyframes lp-pulse { 0%,100%{ transform:scale(1); opacity:.78; } 50%{ transform:scale(1.07); opacity:.96; } }
  .rect.lit { box-shadow: 0 0 9px 2px rgba(143,208,255,.55), 0 0 22px 6px rgba(143,208,255,.32), inset 0 0 4px rgba(255,255,255,.4); }
  .rect.lit-warn { box-shadow: 0 0 8px 2px rgba(255,210,122,.5), 0 0 20px 6px rgba(255,210,122,.3), inset 0 0 4px rgba(255,235,180,.4); }
  .rect.lit-pass { box-shadow: 0 0 10px 2px rgba(123,191,126,.55), 0 0 24px 7px rgba(123,191,126,.32), inset 0 0 4px rgba(210,255,210,.4); }
  .rect.lit-fail { box-shadow: 0 0 9px 2px rgba(226,96,79,.5), 0 0 20px 6px rgba(226,96,79,.3), inset 0 0 4px rgba(255,210,200,.35); }
  .godray { position: absolute; pointer-events: none; mix-blend-mode: screen; opacity: .5;
    background: linear-gradient(180deg, rgba(173,214,255,.5) 0%, rgba(160,200,255,.18) 42%, rgba(160,200,255,0) 92%);
    clip-path: polygon(34% 0, 66% 0, 92% 100%, 8% 100%); filter: blur(3px); animation: shaft 7.5s ease-in-out infinite; transform-origin: 50% 0; }
  .godray.b { opacity:.32; clip-path: polygon(44% 0, 58% 0, 78% 100%, 20% 100%); animation-duration: 9.5s; animation-delay: -3s; }
  @keyframes shaft { 0%,100%{ opacity:.34; transform:skewX(-3deg) scaleX(.96); } 50%{ opacity:.6; transform:skewX(0deg) scaleX(1.04); } }
  .srvled { animation: blink2 1.2s steps(1) infinite; }
  @keyframes blink2 { 0%,100%{opacity:1;} 50%{opacity:.2;} }
  .steam { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.5); filter: blur(2px); }

  .worker { position: absolute; width: 24px; height: 40px; margin-left: -12px; margin-top: -34px; transition: left var(--walk,.6s) linear, top var(--walk,.6s) linear; cursor: pointer; image-rendering: pixelated; }
  .worker .shadow { position: absolute; left: 50%; bottom: -2px; width: 18px; height: 6px; margin-left: -9px; background: rgba(0,0,0,.4); border-radius: 50%; filter: blur(1.5px); transition: width .2s, opacity .2s; }
  .worker.moving .shadow { width: 22px; opacity: .55; animation: shadowpace .42s steps(2) infinite; }
  .worker .body { position: absolute; left: 0; bottom: 6px; width: 24px; height: 34px; transform-origin: 50% 100%; filter: drop-shadow(0 1px 0 rgba(0,0,0,.55)); }
  .worker .stack { position: absolute; inset: 0; animation: sway 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .worker.working .stack { animation: typebob .46s steps(2) infinite; }
  .worker.moving  .stack { animation: walkbob .42s steps(2) infinite; }
  .worker.awaiting .stack { animation: none; }
  .worker .legs  { position: absolute; left: 5px; bottom: 0; width: 14px; height: 7px; background: linear-gradient(90deg,#343c4c 0 50%,#262c38 50% 100%); border-radius: 0 0 1px 1px; }
  .worker .torso { position: absolute; left: 2px; top: 14px; width: 20px; height: 15px; border-radius: 1px;
    background: linear-gradient(90deg, var(--torsoL, #4a6a9a) 0 5px, var(--torso,#3f5f8f) 5px 15px, var(--torsoD,#2f4a72) 15px 20px); }
  .worker.lean .torso { left: 3px; }
  .worker .arms  { position: absolute; left: 2px; top: 21px; width: 20px; height: 5px; opacity: 0; }
  .worker.lean .arms { opacity: 1; left: 3px; }
  .worker .arms::before, .worker .arms::after { content: ""; position: absolute; top: 0; width: 5px; height: 5px; background: var(--torsoD,#2f4a72); border-radius: 1px; }
  .worker .arms::before { left: 0; } .worker .arms::after { right: 0; }
  .worker .hair  { position: absolute; left: 5px; top: 2px; width: 14px; height: 7px; background: linear-gradient(90deg,#473630 0 50%,#33251f 50% 100%); border-radius: 2px 2px 0 0; }
  .worker .hood  { position: absolute; left: 3px; top: 3px; width: 18px; height: 12px; border-radius: 3px 3px 1px 1px;
    background: linear-gradient(90deg, var(--hoodL,#6a96d0) 0 4px, var(--hood,#5a86c0) 4px 14px, var(--hoodD,#456ba0) 14px 18px); }
  .worker .face  { position: absolute; left: 7px; top: 9px; width: 10px; height: 7px; border-radius: 1px;
    background: linear-gradient(90deg,#ffceb0 0 6px,#e9b193 6px 10px); }
  .worker .eye   { position: absolute; left: 12px; top: 11px; width: 2px; height: 2px; background: #2a2330; border-radius: 1px; animation: blinkeye 4.2s steps(1) infinite; }
  .worker .phones { position: absolute; left: 2px; top: 4px; width: 20px; height: 10px; opacity: 0; }
  .worker.emp .phones { opacity: 1; }
  .worker .phones::before, .worker .phones::after { content: ""; position: absolute; top: 4px; width: 3px; height: 6px; background: #20242e; border-radius: 1px; }
  .worker .phones::before { left: 0; } .worker .phones::after { right: 0; }
  .worker .phones i { position: absolute; left: 3px; top: 0; width: 14px; height: 4px; border: 2px solid #20242e; border-bottom: 0; border-radius: 7px 7px 0 0; }
  .worker.mgr { margin-top: -40px; }
  .worker.mgr .hood { top: 1px; background: linear-gradient(90deg,#f2c468 0 4px,#e0a050 4px 14px,#b07a30 14px 18px); }
  .worker.mgr .hair { top: 0; }
  .worker.mgr .torso { background: linear-gradient(90deg,#e8b45a 0 5px,#d49a40 5px 15px,#a8742c 15px 20px); }
  .worker.mgr .crown { position:absolute; left:8px; top:-1px; width:8px; height:4px; background:linear-gradient(90deg,#ffe6ad,#e0a050); border-radius:3px 3px 0 0; }
  .worker.mgr .mantle{ position:absolute; left:1px; top:13px; width:22px; height:4px; background:#8a5e26; border-radius:2px; box-shadow:inset 0 1px 0 rgba(255,224,150,.45); }
  .worker.mgr .robe  { position:absolute; left:2px; top:25px; width:20px; height:15px; border-radius:2px 2px 3px 3px;
    background:linear-gradient(90deg,#d49a40 0 5px,#b07a30 5px 15px,#8a5e26 15px 20px); }
  .worker.mgr .robe::after{ content:""; position:absolute; left:9px; top:1px; width:2px; height:13px; background:#7a5020; }
  .worker.mgr .legs { display:none; }
  .worker .book  { position: absolute; left: -2px; top: 22px; width: 7px; height: 9px; opacity: 0;
    background: linear-gradient(90deg,#caa24a 0 2px,#e8c45e 2px 7px); border: 1px solid #8a6a28; border-radius: 1px 2px 2px 1px; }
  .worker.mgr .book { opacity: 1; z-index: 6; box-shadow: 0 0 6px 2px rgba(255,200,90,.6); }
  .worker .visor { position: absolute; left: 5px; top: 9px; width: 14px; height: 3px; background: #1e3a3a; opacity: 0; border-radius: 1px; }
  .worker.aud .visor { opacity: 1; }
  .worker .clip  { position: absolute; right: -3px; top: 19px; width: 8px; height: 10px; opacity: 0;
    background: linear-gradient(180deg,#d9dde4 0 70%,#b7bcc6 70% 100%); border: 1px solid #6a7078; border-radius: 1px; }
  .worker .clip::before { content: ""; position: absolute; left: 2px; top: -2px; width: 4px; height: 2px; background: #8a9098; border-radius: 1px; }
  .worker.aud .clip { opacity: 1; }
  .worker.aud .arms { opacity: 1; left: 2px; top: 20px; }
  .worker.sip .stack    { animation: sip 1.3s ease-in-out; }
  .worker.stretch .stack{ animation: stretch 1.5s ease-in-out; }
  .worker .bubble { position: absolute; left: 50%; bottom: 100%; margin-bottom: 5px; transform: translateX(-50%) translateY(3px) scale(.92);
    font-size: 10px; line-height: 1.3; font-weight: 500; background: #f4f6fb; color: #232838; padding: 2px 7px; border-radius: 7px;
    white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none;
    box-shadow: 0 2px 5px rgba(0,0,0,.35); transition: opacity .18s ease, transform .18s ease; }
  .worker .bubble::after { content: ""; position: absolute; left: 50%; bottom: -3px; margin-left: -3px; width: 0; height: 0;
    border: 3px solid transparent; border-top-color: #f4f6fb; }
  .worker.talk .bubble { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  .worker .pop { position: absolute; left: 50%; bottom: 100%; margin-bottom: 14px; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: #ffe6ad; opacity: 0; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
  .worker.cel .pop { animation: rise 1.1s ease-out; }
  .worker .think { position: absolute; left: 50%; bottom: 100%; margin-bottom: 3px; margin-left: -1px; width: 3px; height: 3px; border-radius: 50%; background: #ffd27a; opacity: 0; box-shadow: 0 -5px 0 -.5px #ffd27a, 0 -9px 0 -1px #ffd27a; }
  .worker.awaiting .think { opacity: 1; animation: thinkpulse 1.4s ease-in-out infinite; }
  .worker .puff { position: absolute; left: 50%; bottom: -1px; width: 4px; height: 4px; margin-left: -2px; background: rgba(210,220,235,.5); border-radius: 50%; opacity: 0; pointer-events: none; }
  .worker.step .puff { animation: puff .42s ease-out; }

  .cat { position: absolute; image-rendering: pixelated; }
  .cat .b { position: absolute; width: 16px; height: 8px; background: #cbb89a; border-radius: 4px 4px 2px 2px; bottom: 0; animation: bob 2.4s steps(2) infinite; }
  .cat .e1, .cat .e2 { position: absolute; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 4px solid #cbb89a; top: -3px; }
  .cat .e1 { left: 1px; } .cat .e2 { left: 9px; }
  .cat .t { position: absolute; width: 8px; height: 3px; background: #cbb89a; border-radius: 2px; right: -6px; bottom: 4px; }

  .crate { position: absolute; width: 16px; height: 13px; margin-left: -8px; background: linear-gradient(180deg,#9a7350,#5a4636); border: 1px solid #4a3628; image-rendering: pixelated; }
  .dust { position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%; opacity: .35; }
  .ember { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #ffcf8a; box-shadow: 0 0 5px 1px rgba(255,190,110,.8); mix-blend-mode: screen; pointer-events: none; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #eaf2ff; pointer-events: none; animation: twinkle 3.4s ease-in-out infinite; }
  .shootstar { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 2px rgba(255,255,255,.9); pointer-events: none; opacity: 0; }
  .shootstar::after { content:""; position:absolute; right:1px; top:0; width:46px; height:1px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85)); transform-origin: right center; }
  .shootstar.go { animation: shoot 1.1s ease-out; }
  @keyframes twinkle { 0%,100%{ opacity:.25; } 50%{ opacity:.95; } }
  @keyframes ember { 0%{ transform:translate(0,0) scale(1); opacity:0; } 12%{ opacity:.9; } 100%{ transform:translate(8px,-46px) scale(.4); opacity:0; } }
  @keyframes shoot { 0%{ opacity:0; transform:translate(0,0); } 8%{ opacity:1; } 100%{ opacity:0; transform:translate(150px,86px); } }

  /* ===== 道具微细节(纯像素,不抢光层) ===== */
  .pled { position: absolute; width: 2px; height: 2px; margin-left: -1px; margin-top: -1px; border-radius: 1px; pointer-events: none; }
  .pled.b { animation: blink2 1.4s steps(1) infinite; }
  .pchip { position: absolute; pointer-events: none; transition: background .3s; }
  .pcshadow { position: absolute; border-radius: 50%; background: rgba(0,0,0,.34); filter: blur(1.5px); pointer-events: none; }
  .pscan { position: absolute; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px 3px); }
  .pgrain { position: absolute; pointer-events: none; opacity: .12; mix-blend-mode: overlay;
    background: repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 2px); }
  .pspeck { position: absolute; width: 2px; height: 2px; border-radius: 1px; pointer-events: none; }
  .pframe { position: absolute; pointer-events: none; }
  .pclock-h { position: absolute; pointer-events: none; transform-origin: bottom center; }

  .burst { position: absolute; transform: translate(-50%,-50%); width: 30px; height: 30px; opacity: 0; z-index: 9500; }
  .burst.go { animation: burst .8s ease-out; }
  .burst i { position: absolute; inset: 0; border: 3px solid var(--bc,#7bbf7e); border-radius: 50%; }
  .burst u { position: absolute; left: 9px; top: 6px; width: 7px; height: 13px; border: 3px solid var(--bc,#7bbf7e); border-top: 0; border-left: 0; transform: rotate(40deg); }

  @keyframes bob { from{transform:translateY(0);} to{transform:translateY(-2px);} }
  @keyframes typebob   { 0%{transform:translateY(0);} 100%{transform:translateY(-1.5px);} }
  @keyframes walkbob   { 0%{transform:translateY(0) rotate(-1.2deg);} 100%{transform:translateY(-2px) rotate(1.2deg);} }
  @keyframes sway      { 0%,100%{transform:rotate(-1deg);} 50%{transform:rotate(1deg);} }
  @keyframes shadowpace{ 0%{transform:scaleX(.92);} 100%{transform:scaleX(1.06);} }
  @keyframes blinkeye  { 0%,95%,100%{transform:scaleY(1);} 97%{transform:scaleY(.1);} }
  @keyframes thinkpulse{ 0%,100%{opacity:.45;transform:translateY(1px);} 50%{opacity:1;transform:translateY(0);} }
  @keyframes puff      { 0%{opacity:.5;transform:translate(0,0) scale(.6);} 100%{opacity:0;transform:translate(-3px,-5px) scale(1.5);} }
  @keyframes sip       { 0%,100%{transform:translateY(0) rotate(0);} 40%,60%{transform:translateY(-1px) rotate(-3deg);} }
  @keyframes stretch   { 0%,100%{transform:translateY(0) scaleY(1);} 45%{transform:translateY(-2px) scaleY(1.06);} }
  @keyframes rise { 0%{opacity:0;transform:translate(-50%,4px);} 20%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-22px);} }
  @keyframes floaty { from{transform:translateY(0);opacity:.45;} to{transform:translateY(-24px);opacity:0;} }
  @keyframes steam { 0%{transform:translate(0,0) scale(1);opacity:.5;} 100%{transform:translate(-3px,-22px) scale(1.8);opacity:0;} }
  @keyframes shipout { 0%{opacity:0;transform:translate(0,0) scale(.7);} 25%{opacity:1;} 100%{opacity:0;transform:translate(58px,-22px) scale(.9);} }
  @keyframes burst { 0%{opacity:0;transform:translate(-50%,-50%) scale(.3);} 30%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.6);} }
  @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* 叠层 UI */
  .hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 42px;
    background: var(--s-0); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--bd); border-radius: var(--r-3);
    box-shadow: var(--sh-1), inset 0 1px 0 var(--hairline-top); font-size: 12.5px; z-index: 9000; }
  .hud .brand { font-weight: 650; letter-spacing: .6px; color: var(--accent); font-size: 12px; }
  .hud .brand small { color: var(--tx-3); font-weight: 400; letter-spacing: .2px; margin-left: 6px; }
  .hud .stat { color: var(--tx-2); font-size: 11.5px; letter-spacing: .15px; display: inline-flex; align-items: baseline; gap: 5px; }
  .hud .stat b { color: var(--tx-1); font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: 0; }
  .hud .bar { width: 92px; height: 6px; background: var(--s-inset); border-radius: var(--r-pill); overflow: hidden; box-shadow: inset 0 0 0 1px var(--bd-soft); }
  .hud .bar i { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: linear-gradient(90deg,#6cc47a,var(--accent)); box-shadow: 0 0 10px rgba(255,210,122,.35); transition: width .4s var(--ease); }
  .ctrls { position: fixed; top: 14px; right: 16px; display: flex; gap: 8px; z-index: 9000; }
  .ctrls button { font-family: var(--ui); font-size: 12.5px; font-weight: 500; letter-spacing: .15px; cursor: pointer; border-radius: var(--r-2); padding: 9px 14px;
    border: 1px solid var(--bd); display: inline-flex; align-items: center; gap: 7px; transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast); }
  .ctrls button:active { transform: translateY(1px) scale(.985); }
  .b-go { color: #0e1a10; font-weight: 600; background: linear-gradient(180deg,#a6eaa6,#6cc47a); border: 0;
    box-shadow: var(--sh-1), 0 6px 18px rgba(108,196,122,.28), inset 0 1px 0 rgba(255,255,255,.4); }
  .b-go:hover { background: linear-gradient(180deg,#b0f0b0,#75cd83); box-shadow: var(--sh-2), 0 8px 22px rgba(108,196,122,.34), inset 0 1px 0 rgba(255,255,255,.45); }
  .b-gh { color: var(--tx-2); background: var(--s-1); backdrop-filter: var(--blur-sm); -webkit-backdrop-filter: var(--blur-sm); box-shadow: inset 0 1px 0 var(--hairline-top); }
  .b-gh:hover { color: var(--tx-1); background: rgba(30,38,64,.9); border-color: var(--bd-strong); }
  .b-go .arr { width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; opacity: .9; }
  .b-gh .cmd { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--tx-1); border: 1px solid var(--bd-strong); border-radius: 5px; padding: 1px 5px; line-height: 1.3; }
  .b-gh .ico { width: 11px; height: 11px; flex: none; position: relative; }
  .b-gh .ico.pause::before, .b-gh .ico.pause::after { content: ""; position: absolute; top: 1px; bottom: 1px; width: 3px; border-radius: 1px; background: currentColor; }
  .b-gh .ico.pause::before { left: 1px; } .b-gh .ico.pause::after { right: 1px; }
  .b-gh .ico.play::before { content: ""; position: absolute; top: 1px; left: 2px; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .caption { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); max-width: 80vw; display: flex; align-items: center; gap: 11px; padding: 9px 17px;

    list.querySelectorAll('.row').forEach(r=>r.onclick=()=>CMDS[+r.dataset.i][3]());
    closeAll(); $('cmdk').classList.add('on'); scrim(true); const inp=$('cmdk-in'); inp.value=''; setTimeout(()=>inp.focus(),30);
    inp.onkeydown=e=>{ const rows=[...list.querySelectorAll('.row')]; let i=rows.findIndex(r=>r.classList.contains('sel')); if(i<0)i=0;
      if(e.key==='ArrowDown'){ e.preventDefault(); rows[i].classList.remove('sel'); rows[(i+1)%rows.length].classList.add('sel'); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); rows[i].classList.remove('sel'); rows[(i-1+rows.length)%rows.length].classList.add('sel'); }
      else if(e.key==='Enter'){ e.preventDefault(); CMDS[+rows[i].dataset.i][3](); } }; }
  function estop(){ cap('急停 —— 全公司冻结,main 安全。所有 AI 工具权已收回(演示)。'); const all=idle.concat(manager?[manager]:[],auditor?[auditor]:[]);
    all.forEach(w=>w.style.filter='grayscale(1) brightness(.65)'); setTimeout(()=>all.forEach(w=>w.style.filter=''),2200); }

  // 轨迹抽屉(点员工 → 下钻到真实轨迹)
  function openDrawer(w){ const id=w.dataset.id; $('drawer').innerHTML=`<div class="close" id="dw-x">关闭</div>
    <h2 style="padding:0">员工 #${id}</h2><div class="sub" style="padding:6px 0 0">点小人 = 下钻到它的真实轨迹(同一个缩放手势的更深一层)</div>
    <div class="kv" style="margin-top:10px"><b>状态</b><span>${w._busy?'在干活':'休息室待命'}</span></div>
    <div class="kv"><b>花费</b><span>$${(0.6+Math.random()*1.2).toFixed(2)}</span></div>
    <div class="kv"><b>工作区</b><span>worktree/auth-remember-me</span></div>
    <div style="color:#9fb0d0;margin:12px 0 4px">因果链(它为什么在干这个)</div>
    <div class="tree">CEO 目标: 加用户认证
 └─ 经理·决策#7: 拆 3 个并行
     └─ 员工 #${id}  ← 你在这
         查了记忆: JWT 不用 session [已验证·印证]
         产出: +40 −12 行 · 待审计</div>
    <div style="color:#7c89ad;font-size:12px;margin-top:12px">▸ 继续缩放 → 看真实 diff　▸ 看决策当时注入了什么</div>`;
    closeAll(); $('dw-x').onclick=closeAll; $('drawer').classList.add('on'); }

  // ===== 招牌交互①:连续语义缩放(公司→房间→员工→它在改的代码,一个手势)=====
  function altInfo(){ const r=cam.s/fitScale; if(r<1.5)return 0; if(r<2.8)return 1; if(r<4.6)return 2; if(r<8)return 3; return 4; }
  const ROOMNAME=w=>{ const k=roomAt(Math.round(w._c),Math.round(w._r)); return k&&ROOMS[k]?ROOMS[k].label.replace('＋ ',''):'楼层'; };
  let lastShow=null;
  function flyToLevel(l){ if(l===0)return undive(); const map={1:2.2,2:3.6,3:6,4:9}; cam.s=fitScale*(map[l]||6); if(focusW){cam.fx=focusW._x;cam.fy=focusW._y;} applyCam(true); }
  function updateAltitude(){ const n=altInfo(), bc=$('breadcrumb');
    if(n===0||!focusW){ bc.classList.remove('on'); }
    else { const role=focusW._mgr?'经理':focusW._auditor?'独立审计':'员工 #'+focusW.dataset.id;
      const deepL=focusW._mgr?'它的决策与记忆书':focusW._auditor?'审计裁定':'它在改的代码';
      const parts=[['公司',0]]; if(n>=1)parts.push([ROOMNAME(focusW),1]); if(n>=2)parts.push([role,2]); if(n>=3)parts.push([deepL,3]); if(n>=4&&!focusW._mgr&&!focusW._auditor)parts.push(['测试 + 变异式',4]);
      bc.innerHTML=parts.map(([t,l],i)=>`${i?'<span class="sep">›</span> ':''}<b class="bcp" data-l="${l}">${t}</b>`).join('');
      bc.querySelectorAll('.bcp').forEach(el=>el.onclick=()=>flyToLevel(+el.dataset.l)); bc.classList.add('on'); }
    if(focusW&&n>=3){ const deep=(n>=4&&!focusW._mgr&&!focusW._auditor); if(!lastShow||lastShow.w!==focusW||lastShow.deep!==deep){ showWork(focusW,deep); lastShow={w:focusW,deep}; } }
    else if($('worksurf').classList.contains('on')){ $('worksurf').classList.remove('on'); stage.classList.remove('zoomed'); lastShow=null; } }
  function nearestWorker(){ const live=[...idle,manager,auditor].filter(Boolean); return live.find(w=>w._busy)||live[0]; }
  function dive(w){ if(!w)return; focusW=w; closeAll(); cam.fx=w._x; cam.fy=w._y; cam.s=fitScale*6; applyCam(true); $('zoomhint').classList.add('on');
    cap(`缩进「${w._mgr?'经理':w._auditor?'独立审计':'员工 #'+w.dataset.id}」—— 滚轮继续缩放,Esc 退回公司。`); }
  function undive(){ focusW=null; $('worksurf').classList.remove('on'); stage.classList.remove('zoomed'); $('zoomhint').classList.remove('on'); $('breadcrumb').classList.remove('on');
    const W=world.offsetWidth,H=world.offsetHeight; cam.s=fitScale; cam.fx=W/2; cam.fy=H/2; applyCam(true); }
  function nearestTo(wx,wy){ const live=[...idle,manager,auditor].filter(Boolean); let best=null,bd=1e9; for(const w of live){ const d=(w._x-wx)**2+(w._y-wy)**2; if(d<bd){bd=d;best=w;} } return best; }
  let wheelLock=false;
  stage.addEventListener('wheel',e=>{ if(document.querySelector('.panel.on,.cmdk.on'))return; e.preventDefault(); if(wheelLock)return; wheelLock=true; requestAnimationFrame(()=>{wheelLock=false;});
    const vcx=window.innerWidth/2, vcy=window.innerHeight/2;
    const wx=cam.fx+(e.clientX-vcx)/cam.s, wy=cam.fy+(e.clientY-vcy)/cam.s;          // 光标下的世界点
    const ns=Math.max(fitScale,Math.min(fitScale*10,cam.s*(e.deltaY<0?1.16:1/1.16)));
    if(ns<=fitScale*1.02){ undive(); return; }
    cam.s=ns; cam.fx=wx-(e.clientX-vcx)/ns; cam.fy=wy-(e.clientY-vcy)/ns;             // 朝光标缩放,该点不动
    if(!focusW||altInfo()<2){ const nf=nearestTo(wx,wy); if(nf)focusW=nf; }
    $('zoomhint').classList.add('on'); applyCam('fast'); },{passive:false});

  function diffHtml(){ const L=[['ctx',12,'export function login(req, res) {'],['ctx',13,'  const { user, pass } = req.body;'],['del',14,'  const token = sign(user, "1d");'],['add',14,'  const ttl = req.body.remember ? "30d" : "1d";'],['add',15,'  const token = sign(user, ttl);'],['ctx',16,'  res.cookie("sid", token);'],['add',17,'  res.cookie("remember", !!req.body.remember);'],['ctx',18,'  return res.json({ ok: true });'],['ctx',19,'}']];
    return L.map(([t,n,c])=>`<div class="ln ${t==='add'?'add':t==='del'?'del':''}"><span class="g">${t==='add'?'+':t==='del'?'−':''}${n}</span><span class="c">${c.replace(/</g,'&lt;')}</span></div>`).join(''); }
  function divePanel(w,deep){ const id=w.dataset.id;
    if(w._mgr)return{dot:'#ffd27a',head:`经理 · 决策 #7`,meta:`它做决策时看到的:「认证模块当前无实现」<b>[事实#F212 · 已验证·机械]</b> · 实时:0 员工在跑、预算 $7.60 剩 → 决定 spawn 3 个并行`,body:`<div class="mem"><div class="memrow gold">JWT 不用 session 库<span>权威</span></div><div class="memrow">上次 OAuth 失败于回调<span>员工汇报</span></div><div class="memrow torn">员工7 声称缓存可关<span>待审 · 不可信</span></div></div>`,foot:`<button class="pbtn" id="ws-trust">调它的信任设置 →</button><button class="pbtn go" id="ws-close">收起 ▾</button>`};
    if(w._auditor)return{dot:'#46a0a0',head:`独立审计 · 干净环境重验`,meta:`在一份干净克隆里重跑测试 + 变异式探针。裁判不由生产者,这份裁定承重。`,body:`<div class="chk ok">干净环境重验通过</div><div class="chk ok">测试没被改弱(变异式验证)</div><div class="chk ok">没扫到密钥</div><div class="chk ok">对抗式发现 2 条(1 提醒 · 1 已自动修)</div>`,foot:`<button class="pbtn go" id="ws-review">去验收 →</button><button class="pbtn" id="ws-close">收起 ▾</button>`};
    if(deep)return{dot:'#8fd0ff',head:`员工 #${id} · 测试 + 变异式验证`,meta:`再钻一层:审计在干净克隆里重跑测试,并对断言做变异,确认测试不是摆设。`,body:`<div class="chk ok">17 个测试全绿(干净环境重跑)</div><div class="chk ok">变异式探针:12 处变异 · 11 处被测试抓出</div><div class="chk warn">1 处变异存活 → 已自动补一条断言</div><div class="chk ok">没有被跳过 / 置空的测试</div>`,foot:`<button class="pbtn" id="ws-back">← 退回看 diff</button><button class="pbtn go" id="ws-close">收起 ▾</button>`};
    return{dot:'#8fd0ff',head:`员工 #${id} · auth.rs · 待审计`,meta:`经理决策#7 派它做这个 · 查了记忆「JWT 不用 session」<b>[已验证·印证]</b> · 产出 +4 −1 行`,body:diffHtml(),foot:`<button class="pbtn" id="ws-test">继续缩放 → 看测试</button><button class="pbtn go" id="ws-close">收起 ▾</button>`}; }
  function showWork(w,deep){ const p=divePanel(w,deep); $('worksurf').innerHTML=`<div class="wbar"><span class="dot3"><i style="background:#e2604f"></i><i style="background:#ffd27a"></i><i style="background:#6cc47a"></i></span><span class="stq" style="color:${p.dot};background:${p.dot}"></span>${p.head}</div><div class="wmeta">${p.meta}</div><div class="code">${p.body}</div><div class="wfoot">${p.foot}</div>`;
    $('worksurf').classList.add('on'); stage.classList.add('zoomed');
    let el; if(el=$('ws-close'))el.onclick=undive; if(el=$('ws-trust'))el.onclick=()=>{undive();openTrust();}; if(el=$('ws-review'))el.onclick=()=>{undive();openReview();}; if(el=$('ws-test'))el.onclick=()=>flyToLevel(4); if(el=$('ws-back'))el.onclick=()=>flyToLevel(3); }

  // ===== 招牌交互②:时间轴 —— 把整夜倒回任意一刻(ghost 真复现当时每个人在哪)=====
  const fmt=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  let hist=[], ghosts=[];
  const liveW=()=>[...idle, ...(manager?[manager]:[]), ...(auditor?[auditor]:[])];
  const gcolor=w=>w.classList.contains('awaiting')?'#ffd27a':(w._busy?'#8fd0ff':'#6b7596');
  function recordTick(){ const sc=$('scrub'); if(+sc.value<+sc.max)return;
    hist.push({pos:liveW().map(w=>({x:w._x,y:w._y,c:gcolor(w)})),spent:S.spent,run:S.run,t:23*60+14+hist.length*6});
    if(hist.length>40)hist.shift(); sc.max=Math.max(1,hist.length-1); if(!sc._drag)sc.value=sc.max; }
  function clearGhosts(){ ghosts.forEach(g=>g.remove()); ghosts=[]; world.classList.remove('replay'); $('scrublabel').classList.remove('on'); }
  function renderReplay(){ const sc=$('scrub'), idx=+sc.value; if(idx>=+sc.max){ clearGhosts(); return; }
    const f=hist[idx]; if(!f)return; world.classList.add('replay'); ghosts.forEach(g=>g.remove());
    ghosts=f.pos.map(pp=>{ const g=document.createElement('div'); g.className='ghost'; g.style.left=pp.x+'px'; g.style.top=pp.y+'px'; g.style.setProperty('--gc',pp.c); g.style.zIndex=9000; world.appendChild(g); return g; });
    $('scrublabel').textContent=`回放 · ${fmt(f.t)} · 当时 ${f.run} 在干 · $${f.spent.toFixed(2)}`; $('scrublabel').classList.add('on'); }
  (function initScrub(){ const sc=$('scrub'); sc.addEventListener('input',renderReplay);
    sc.addEventListener('pointerdown',()=>{sc._drag=true;}); sc.addEventListener('pointerup',()=>{ sc._drag=false; if(+sc.value>=+sc.max){ clearGhosts(); cap('回到现在 —— 公司继续运转。'); } });
    sc.title='拖动倒回整夜任意一刻'; })();
  setInterval(recordTick,650);

  // ===== 招牌交互③:Tab 跳到下一个需要你的 · hover 速览 · 夜色呼吸 =====
  let tabIdx=0;
  function jumpToProblem(){ const list=[...idle].filter(w=>w.classList.contains('awaiting')&&!w._busy); if(!list.length){ cap('没有需要你拍板的 —— 公司顺着跑,继续睡。'); return; } const w=list[tabIdx++%list.length]; cap(`Tab 跳到等你拍板的「员工 #${w.dataset.id}」。`); dive(w); }
  function showPeek(w){ if(focusW)return; const r=w.getBoundingClientRect(); const role=w._mgr?'经理':w._auditor?'独立审计':'员工 #'+w.dataset.id;
    const st=w.classList.contains('awaiting')?'<span style="color:#ffd27a">等你拍板</span>':w._busy?('在干:'+(w._task||'任务')):'休息室待命';
    const pk=$('peek'); pk.innerHTML=`<b>${role}</b> · ${st}`; pk.style.left=Math.max(80,Math.min(window.innerWidth-90,r.left+r.width/2))+'px'; pk.style.top=Math.max(70,r.top-30)+'px'; pk.classList.add('on'); }
  function hidePeek(){ $('peek').classList.remove('on'); }
  const lerp3=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
  const DUSK=[42,34,58], DEEP=[8,14,34], DAWN=[20,34,64];
  const HOT=[120,72,46], COOL=[26,40,78], COLD=[36,58,96], COOLTOP=[10,16,40];
  let nightT=0, LAMPS=[];
  function nightTick(){ nightT=(nightT+0.45)%100; const p=nightT/100; let c,op,horiz,hk;
    if(p<0.45){ const k=p/0.45; c=lerp3(DUSK,DEEP,k); op=0.10+0.34*k; horiz=lerp3(HOT,COOL,k); hk=0.34*(1-k)+0.06; }
    else if(p<0.82){ const k=(p-0.45)/0.37; c=lerp3(DEEP,DAWN,k); op=0.44-0.18*k; horiz=lerp3(COOL,COLD,k); hk=0.06+0.05*k; }
    else { const k=(p-0.82)/0.18; c=lerp3(DAWN,DUSK,k); op=0.26-0.16*k; horiz=lerp3(COLD,HOT,k); hk=0.11+0.26*k; }
    const top=lerp3(c, COOLTOP, 0.45);
    $('sky').style.background=
      `linear-gradient(180deg, rgba(${top[0]},${top[1]},${top[2]},${(op*0.9).toFixed(3)}) 0%,`+
      ` rgba(${c[0]},${c[1]},${c[2]},${op.toFixed(3)}) 48%,`+
      ` rgba(${horiz[0]},${horiz[1]},${horiz[2]},${hk.toFixed(3)}) 100%)`; }
  setInterval(nightTick,650); nightTick();

  // 余烬:暖灯附近偶尔升起一颗暖星(粒子封顶)
  function spawnEmbers(){ if(!LAMPS.length)return; const warm=LAMPS.filter(l=>l.warm); if(!warm.length)return;
    const live=world.querySelectorAll('.ember'); if(live.length>10)return;
    const L=warm[(Math.random()*warm.length)|0]; const e=document.createElement('div'); e.className='ember';
    e.style.left=(L.x-8+Math.random()*16)+'px'; e.style.top=(L.y+4+Math.random()*8)+'px'; e.style.zIndex=L.z;
    e.style.animation=`ember ${2.4+Math.random()*1.8}s ease-out forwards`; world.appendChild(e);
    setTimeout(()=>e.remove(),4400); }
  setInterval(spawnEmbers,900);
  // 流星:守夜奖励,间隔随机
  let shooter=null;
  function spawnShooter(){ if(!shooter){ shooter=document.createElement('div'); shooter.className='shootstar'; shooter.style.zIndex=60; world.appendChild(shooter); }
    const startX= Math.random()<0.5 ? -20+Math.random()*120 : 240+Math.random()*120;
    shooter.style.left=startX+'px'; shooter.style.top=(-60-Math.random()*30)+'px';
    shooter.classList.remove('go'); void shooter.offsetWidth; shooter.classList.add('go');
    setTimeout(spawnShooter, 12000+Math.random()*16000); }
  // 预算=能量:spent 越逼近上限 → 全场越冷越暗;临界亮红边
  function budgetTick(){ const f=Math.min(1,S.spent/30); const e=Math.sqrt(f);
    $('budgetTint').style.opacity=(e*0.55).toFixed(3);
    const re=$('rededge'); if(f>0.78){ re.style.setProperty('--re',((f-0.78)/0.22*0.45+0.12).toFixed(3)); re.style.opacity=re.style.getPropertyValue('--re'); re.classList.add('pulse'); }
    else { re.classList.remove('pulse'); re.style.opacity='0'; } }
  setInterval(budgetTick,800); budgetTick();

  build(); fit(); window.addEventListener('resize',fit);
  startAuto();
})();
</script>
